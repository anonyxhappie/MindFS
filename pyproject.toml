[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mindfs"
version = "0.1.0"
description = "Local, privacy-first filesystem intelligence engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "pypdf>=3.0",
    "pillow>=10.0",
    "psutil>=5.9",
    "numpy>=1.24",
]

[project.scripts]
mindfs = "mindfs.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mindfs*"]

